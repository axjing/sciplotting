name: CI - Scientific Plotting Standards Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Test Suite (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Scientific Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy scipy pandas pillow

      - name: Run Sciplotting Test Suite
        run: |
          python -m unittest discover tests

      - name: Audit All Standard Palettes
        run: |
          python scripts/python/check_palette.py --palette nature_main_5 --format text
          python scripts/python/check_palette.py --palette okabe_ito_8 --format text
          python scripts/python/check_palette.py --palette viridis --format text
          python scripts/python/check_palette.py --palette RdBu --format text

  test-tikz:
    name: TikZ / LaTeX Vector Templates Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeXLive & TikZ Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-pictures texlive-latex-extra

      - name: Compile All TikZ Templates
        run: |
          cd scripts/tikz
          pdflatex -interaction=nonstopmode linear_workflow.tex
          pdflatex -interaction=nonstopmode parallel_workflow.tex
          pdflatex -interaction=nonstopmode signaling_pathway.tex
          pdflatex -interaction=nonstopmode apparatus_schematic.tex
